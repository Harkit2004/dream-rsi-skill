[project]
name = "dream-rsi"
version = "0.0.1"
description = "Dream-RSI: recursive self-improvement of exploration policies via replay simulators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8", "pyyaml==6.0.3", "hatchling==1.32.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dream_rsi"]

# The skill ships in the wheel as package data, so `pip install git+https://...` and
# `python -m dream_rsi.install` work without a clone. The root SKILL.md stays the one
# source: this includes it at build time and keeps no second copy in the tree.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "dream_rsi/skill/SKILL.md"
"references/method.md" = "dream_rsi/skill/references/method.md"
"references/task_template.py" = "dream_rsi/skill/references/task_template.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
